server:
  port: ${ACCOUNT_SERVICE_PORT:8082} # puerto del servicio

spring:
  application:
    name: account-service

  r2dbc:
    url: ${ACCOUNT_SERVICE_R2DBC_URL:r2dbc:postgresql://localhost:5432/postgres}
    username: ${ACCOUNT_SERVICE_R2DBC_USERNAME:postgres}
    password: ${ACCOUNT_SERVICE_R2DBC_PASSWORD:''}

  flyway:
    enabled: ${ACCOUNT_SERVICE_FLYWAY_ENABLED:false}

  grpc:
    server:
      port: ${ACCOUNT_SERVICE_GRPC_PORT:9091} # puerto gRPC
