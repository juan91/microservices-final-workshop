server:
  port: ${BANK_SERVICE_PORT:8081}

spring:
  application:
    name: ${BANK_SERVICE_NAME:bank-service}

  r2dbc:
    url: ${BANK_SERVICE_R2DBC_URL:r2dbc:postgresql://localhost:5432/postgres}
    username: ${BANK_SERVICE_R2DBC_USERNAME:postgres}
    password: ${BANK_SERVICE_R2DBC_PASSWORD:''}

  flyway:
    enabled: ${BANK_SERVICE_FLYWAY_ENABLED:false}